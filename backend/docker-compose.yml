services:
  postgres:
    image: postgres:16-alpine
    container_name: voleytrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voleytrack}
      POSTGRES_USER: ${POSTGRES_USER:-voleytrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voleytrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voleytrack} -d ${POSTGRES_DB:-voleytrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
