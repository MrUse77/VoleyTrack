services:
  db:
    image: postgres:16-alpine
    container_name: voleytrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: voleytrack
      POSTGRES_PASSWORD: voleytrack
      POSTGRES_DB: voleytrack
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voleytrack -d voleytrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: voleytrack-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
