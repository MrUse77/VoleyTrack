spring.application.name=voleytrack

# ── PostgreSQL ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voleytrack?stringtype=unspecified}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:voleytrack}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:voleytrack}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Flyway ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
