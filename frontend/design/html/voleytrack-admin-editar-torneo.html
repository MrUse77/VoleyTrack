<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoleyTrack — Admin · Editar torneo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="imagen.png" />
<link rel="stylesheet" href="voleytrack-admin.css" />
</head>
<body>
<div id="app" class="app" data-od-id="app-shell-admin">

  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-mark"><img src="imagen.png" alt="VoleyTrack icono" /></div>
      <div class="logo-type">VoleyTrack</div>
    </div>
    <div class="topbar-nav">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg><input placeholder="Buscar equipo, jugador, torneo…" /></label>
      <div style="flex:1"></div>
      <div class="top-icons">
        <button class="icon-btn" aria-label="Notificaciones"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7-6 5-6 9"/><path d="M10 18h4"/></svg><span class="dot"></span></button>
        <div class="avatar">A</div>
      </div>
    </div>
  </header>
  <div class="shell">

    <aside class="sidebar">
      <div class="nav-group">
        <p class="nav-title">Admin · Gestión</p>
        <a class="nav-item" href="voleytrack-admin-gestion.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M20 21a8 8 0 1 0-16 0"/></svg> Staff & gestión</a>
        <a class="nav-item" href="voleytrack-admin-partidos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg> Partidos</a>
        <a class="nav-item" href="voleytrack-admin-equipos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6"/><path d="M23 11v2"/><path d="M17 11v2"/></svg> Equipos</a>
        <a class="nav-item" href="voleytrack-admin-jugadores.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Jugadores</a>
        <a class="nav-item" href="voleytrack-admin-torneos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 13c0 3 2 5 6 5s6-2 6-5l-6-7-6 7z"/><path d="M9 13h6"/></svg> Torneos</a>
      </div>
      <a class="nav-item" style="margin-top:10px;color:var(--muted)" href="voleytrack-login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Cerrar sesión</a>
    </aside>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>Editar torneo</h1>
          <p>Modificar los datos del torneo <b>Liga Argentina A1</b> · Temporada 2025/26</p>
        </div>
        <div class="head-actions">
          <a class="btn ghost" href="voleytrack-admin-ver-torneo.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> Volver</a>
        </div>
      </div>

      <div class="card">
        <div class="card-h">Datos del torneo <small>FORMULARIO</small></div>
        <div class="card-b">
          <div class="form-grid">
            <div class="field full">
              <label>Nombre del torneo</label>
              <input type="text" value="Liga Argentina A1" />
            </div>
            <div class="field">
              <label>Temporada</label>
              <select><option>2025/26</option><option>2024/25</option><option>2026/27</option></select>
            </div>
            <div class="field">
              <label>Sistema de competencia</label>
              <select><option>Liga regular</option><option>Liga + playoffs</option><option>Eliminación directa</option><option>Fase de grupos</option></select>
            </div>
            <div class="field">
              <label>Estado</label>
              <select><option>En curso</option><option>Programado</option><option>Finalizado</option><option>Suspendido</option></select>
            </div>
            <div class="field">
              <label>Cantidad de equipos</label>
              <input type="number" value="18" min="2" />
            </div>
            <div class="field">
              <label>Fecha de inicio</label>
              <input type="date" value="2026-03-15" />
            </div>
            <div class="field">
              <label>Fecha de finalización</label>
              <input type="date" value="2026-12-12" />
            </div>
            <div class="field full">
              <label>Descripción</label>
              <textarea placeholder="Descripción breve del torneo">Competencia nacional de primera división con 18 equipos.</textarea>
            </div>
          </div>
          <div class="form-actions">
            <a class="btn ghost" href="voleytrack-admin-ver-torneo.html">Cancelar</a>
            <a class="btn accent" href="voleytrack-admin-gestion.html">Guardar cambios</a>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
