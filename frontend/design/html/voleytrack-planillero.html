<!doctype html>
<html lang="es-ES">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoleyTrack · Planillero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="imagen.png" />
<link rel="stylesheet" href="voleytrack-admin.css" />
</head>
<body>
<div id="app" class="app" data-od-id="app-shell-planillero">
  <header class="topbar" data-od-id="planillero-topbar">
    <div class="topbar-left"><div class="logo-mark"><img src="imagen.png" alt="Icono de VoleyTrack" /></div><div><div class="logo-type">VoleyTrack</div><div class="match-source">Planillero</div></div></div>
    <div style="flex:1"></div><a class="btn ghost" href="voleytrack-login.html" data-od-id="planillero-logout">Cerrar sesión</a>
  </header>
  <main class="main" style="max-width:960px;margin:0 auto" data-od-id="planillero-main-region">
    <section id="assigned-view" data-od-id="assigned-matches-view">
      <div class="page-head"><div><h1 data-od-id="assigned-matches-title">Partidos asignados</h1><p>Selecciona un partido programado para preparar la planilla.</p></div></div>
      <div class="match-list" id="assigned-matches" data-od-id="assigned-matches-list"></div>
      <div class="card empty-state" id="assigned-empty" data-od-id="assigned-matches-empty" role="status" hidden><h2>No hay partidos creados</h2><p>Los partidos programados por administración aparecerán aquí.</p></div>
    </section>
    <section id="setup-view" data-od-id="match-setup-view" hidden>
      <div class="page-head"><div><p class="match-source">Preparación del partido</p><h1 id="match-setup-title" data-od-id="match-setup-title" tabindex="-1">Setup</h1><p id="setup-meta"></p></div><button class="btn ghost" type="button" id="back-to-matches" data-od-id="back-to-assigned-matches">Volver a partidos</button></div>
      <div class="card" data-od-id="match-setup-card">
        <div class="card-h">Partido seleccionado <small>Estado: Programado</small></div>
        <div class="card-b"><div class="setup-grid"><div class="setup-team" id="setup-home" data-od-id="setup-home-team"></div><div class="setup-versus">contra</div><div class="setup-team" id="setup-away" data-od-id="setup-away-team"></div></div>
          <div class="form-actions"><button class="btn accent" type="button" id="start-match" data-od-id="start-match-cta">Iniciar partido</button></div>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
const MATCHES_KEY='voleytrack-admin-matches';
const SELECTED_KEY='voleytrack-planillero-selected-match';
const assignedView=document.getElementById('assigned-view');const setupView=document.getElementById('setup-view');const list=document.getElementById('assigned-matches');const empty=document.getElementById('assigned-empty');let selectedMatch=null;
function readMatches(){try{const value=JSON.parse(localStorage.getItem(MATCHES_KEY)||'[]');return Array.isArray(value)?value:[]}catch{return []}}
function formatDate(value){return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(`${value}:00`))}
function openSetup(match){selectedMatch=match;localStorage.setItem(SELECTED_KEY,match.id);document.getElementById('setup-home').textContent=match.homeTeamName;document.getElementById('setup-away').textContent=match.awayTeamName;document.getElementById('setup-meta').textContent=`${match.tournamentName} · ${formatDate(match.scheduledAt)}`;assignedView.hidden=true;setupView.hidden=false;document.getElementById('match-setup-title').focus()}
function renderMatches(){
  const matches=readMatches().filter(match=>match.status==='Programado').sort((a,b)=>a.scheduledAt.localeCompare(b.scheduledAt));list.replaceChildren();
  matches.forEach(match=>{const button=document.createElement('button');button.type='button';button.className='match-card match-select';button.dataset.odId=`assigned-match-${match.id}`;const info=document.createElement('span');const title=document.createElement('h2');title.textContent=`${match.homeTeamName} vs ${match.awayTeamName}`;const meta=document.createElement('span');meta.className='match-meta';meta.textContent=`${match.tournamentName} · ${formatDate(match.scheduledAt)}`;info.append(title,meta);const status=document.createElement('span');status.className='state-pill s-programado';status.textContent='Programado';button.append(info,status);button.addEventListener('click',()=>openSetup(match));list.append(button)});
  list.hidden=matches.length===0;empty.hidden=matches.length!==0;
}
document.getElementById('back-to-matches').addEventListener('click',()=>{selectedMatch=null;setupView.hidden=true;assignedView.hidden=false;renderMatches();list.querySelector('button')?.focus()});
document.getElementById('start-match').addEventListener('click',()=>{if(!selectedMatch)return;const matches=readMatches();const current=matches.find(match=>match.id===selectedMatch.id);if(!current)return;current.status='En vivo';localStorage.setItem(MATCHES_KEY,JSON.stringify(matches));localStorage.setItem(SELECTED_KEY,current.id);window.location.href='voleytrack-live.html'});
renderMatches();
</script>
</body>
</html>
