schema: spec-driven

context: |
  Tech stack: Angular 21 standalone app, TypeScript 5.9, Angular Material, Tailwind CSS, RxJS, npm.
  Architecture: routed SPA with standalone bootstrap via app.config.ts; strict TS and SCSS.
  Testing: ng test via @angular/build unit-test runner with Vitest; app.spec.ts exists.
  Style: SCSS, Angular Material theme, Prettier available, no lint config detected.

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  test_runner:
    command: ng test
    framework: Vitest via @angular/build
  layers:
    unit: available
    integration: unavailable
    e2e: unavailable
  coverage:
    available: false
    command: none
  quality:
    linter: unavailable
    type_checker: npx tsc --noEmit
    formatter: npx prettier
