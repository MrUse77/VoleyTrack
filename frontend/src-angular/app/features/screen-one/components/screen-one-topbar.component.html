<header class="border-b border-vt-border bg-vt-surface">
  <div
    class="mx-auto flex h-16 w-full max-w-[1600px] items-center justify-between gap-4 px-4 md:px-6"
  >
    <div class="flex min-w-0 items-center gap-6">
      <div class="flex items-center gap-2 text-white">
        <img src="/icon.svg" alt="VOLLEYTRACK" width="25" height="25" class="shrink-0" />
        <span class="text-lg font-black uppercase tracking-[-0.04em] text-white">
          VOLLEY<span class="text-vt-accent">TRACK</span>
        </span>
      </div>

      <nav class="hidden items-center gap-1 lg:flex" aria-label="Primary navigation">
        @for (item of navigation; track item.label) {
          <a
            class="border-b-2 px-3 py-5 text-sm font-bold uppercase tracking-[0.08em] transition"
            [class.border-vt-accent]="item.active"
            [class.bg-white/5]="item.active"
            [class.border-transparent]="!item.active"
            [class.text-white]="item.active"
            [class.text-vt-muted]="!item.active"
            [attr.aria-current]="item.active ? 'page' : null"
            [href]="item.href"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>

    <div class="flex items-center gap-3">
      <!--
      <div
        class="hidden items-center gap-2 rounded border border-vt-border bg-black/20 px-3 py-1.5 lg:flex"
      >
        <mat-icon svgIcon="vt-search" class="!h-4 !w-4 text-vt-muted" aria-hidden="true" />
        <input
          class="w-32 border-0 bg-transparent text-sm text-white outline-none placeholder:text-vt-muted"
          placeholder="Search..."
          type="text"
        />
      </div>
      -->

      <button
        class="inline-flex h-9 w-9 items-center justify-center text-vt-muted transition hover:text-white"
        type="button"
        aria-label="Notifications"
      >
        <!-- <mat-icon svgIcon="vt-notifications" class="!h-5 !w-5" aria-hidden="true" /> -->
        <span aria-hidden="true">🔔</span>
      </button>

      <button
        class="inline-flex h-9 w-9 items-center justify-center rounded border border-vt-border bg-black/20 text-sm font-semibold text-white"
        type="button"
        aria-label="User avatar"
      >
        AV
      </button>
    </div>
  </div>
</header>
