<div class="min-h-screen bg-vt-page text-vt-text">
  <app-screen-one-topbar [brand]="vm.brand" [navigation]="vm.navigation" [utility]="vm.utility" />

  <main class="mx-auto flex w-full max-w-[1599px] flex-col gap-5 px-4 py-5 lg:px-6 xl:flex-row">
    <section class="min-w-0 flex-1 space-y-5">
      <app-screen-one-hero [hero]="vm.hero" [utility]="vm.utility" />
      <app-screen-one-lists [sections]="vm.lists" />
    </section>

    <app-screen-one-rail class="w-full xl:w-[320px]" [cards]="vm.rail" />
  </main>
</div>
